name: Gerar Juh Quiz — Verdadeiro ou Falso

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vf.txt

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core rclone espeak-ng

      - name: Instalar dependências do formato
        run: python -m pip install -r requirements-vf.txt

      - name: Gerar vídeos e legendas
        env:
          RCLONE_CONFIG_DESTINO_TYPE: drive
          RCLONE_CONFIG_DESTINO_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          RCLONE_CONFIG_DESTINO_ROOT_FOLDER_ID: 1IeWfSGxVOgY4nwLQwGxzPZMqRCO81i8B
        run: python -u gerar_vf.py --enviar-drive --lote "${{ github.run_id }}"

      - name: Disponibilizar MP4 e TXT
        uses: actions/upload-artifact@v7
        with:
          name: juh-quiz-verdadeiro-ou-falso
          path: saida_vf/
          if-no-files-found: error
          retention-days: 30
